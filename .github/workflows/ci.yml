# ABOUTME: CI for the film and deck video: lint, type check, unit and integration tests on every push and pull request.
# ABOUTME: The e2e render test needs a browser and the media, so it runs locally with npm run test:e2e.
name: ci

on:
  push:
    branches: [staging, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
