# ABOUTME: CI for the film and deck video: lint, type check, unit and integration tests on every push and pull request.
# ABOUTME: The e2e render test needs a browser and the media, so it runs locally with npm run test:e2e.
name: ci

on:
  push:
    branches: [staging, main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
